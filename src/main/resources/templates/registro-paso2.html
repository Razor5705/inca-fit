<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Registro - Paso 2</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
                    <h3 class="fw-light my-4">Paso 2: Elige tu Membresía</h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-center mb-4">¡Ya casi estás! Selecciona el plan que mejor se adapte a ti.</p>

                    <div th:if="${param.error}" class="alert alert-danger">
                        Hubo un error al seleccionar la membresía. Por favor, inténtalo de nuevo.
                    </div>

                    <form th:action="@{/registro/paso2}" method="post">
                        <div class="row">
                            <div th:each="membresia : ${membresias}" class="col-md-4 mb-4">
                                <div class="card h-100 text-center">
                                    <div class="card-header bg-light">
                                        <h5 th:text="${membresia.tipoMembresia}">Nombre de Membresía</h5>
                                    </div>
                                    <div class="card-body">
                                        <h6 class="card-title" th:text="${membresia.precio} + ' € / ' + ${membresia.duracionDias} + ' días'">Precio / Duración</h6>
                                        <p class="card-text" th:text="${membresia.descripcion}">Descripción de la membresía.</p>
                                    </div>
                                    <div class="card-footer">
                                        <button type="submit" name="membresiaId" th:value="${membresia.id}" class="btn btn-primary-custom">
                                            Seleccionar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small">
                        <a th:href="@{/registro}">Volver al paso anterior</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
