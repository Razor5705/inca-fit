<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Formulario de Reserva</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <h2 class="mb-4" th:text="${reserva.id == null ? 'Nueva Reserva' : 'Editar Reserva'}">Formulario de Reserva</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/reservas/guardar}" th:object="${reserva}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="socio" class="form-label">Socio</label>
                            <select class="form-select" id="socio" th:field="*{socio}" required>
                                <option value="">Seleccionar socio...</option>
                                <option th:each="socio : ${socios}" 
                                        th:value="${socio.id}" 
                                        th:text="${socio.nombre + ' (' + socio.email + ')'}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="clase" class="form-label">Clase</label>
                            <select class="form-select" id="clase" th:field="*{clase}" required>
                                <option value="">Seleccionar clase...</option>
                                <option th:each="clase : ${clases}" 
                                        th:value="${clase.id}" 
                                        th:text="${clase.nombre + ' - ' + clase.instructor.nombreCompleto}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fechaHora" class="form-label">Fecha y Hora</label>
                            <input type="datetime-local" class="form-control" id="fechaHora" th:field="*{fechaHora}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" th:field="*{estado}" required>
                                <option value="CONFIRMADA">Confirmada</option>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="CANCELADA">Cancelada</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/admin/reservas}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
