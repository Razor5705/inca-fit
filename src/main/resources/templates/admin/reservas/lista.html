<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
  <title>Administrar Reservas</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
          <i class="fas fa-calendar-check me-2"></i>Administrar Reservas
        </h2>
        <a th:href="@{/admin/reservas/nueva}" class="btn btn-primary">
          <i class="fas fa-plus me-2"></i>Nueva Reserva
        </a>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Socio</th>
                  <th>Clase</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="reserva : ${reservas}">
                  <td th:text="${reserva.id}"></td>
                  <td th:text="${reserva.socio.nombre}"></td>
                  <td th:text="${reserva.clase.nombre}"></td>
                  <td th:text="${#temporals.format(reserva.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                  <td>
                    <span th:if="${reserva.estado == 'CONFIRMADA'}" class="badge bg-success">Confirmada</span>
                    <span th:if="${reserva.estado == 'PENDIENTE'}" class="badge bg-warning">Pendiente</span>
                    <span th:if="${reserva.estado == 'CANCELADA'}" class="badge bg-danger">Cancelada</span>
                  </td>
                  <td>
                    <a th:href="@{/admin/reservas/ver/{id}(id=${reserva.id})}" class="btn btn-sm btn-info me-1">
                      <i class="fas fa-eye"></i>
                    </a>
                    <a th:href="@{/admin/reservas/editar/{id}(id=${reserva.id})}" class="btn btn-sm btn-warning me-1">
                      <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{/admin/reservas/eliminar/{id}(id=${reserva.id})}" method="post" style="display: inline;">
                      <button type="submit" class="btn btn-sm btn-danger" 
                              onclick="return confirm('¿Estás seguro de eliminar esta reserva?')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservas)}">
                  <td colspan="6" class="text-center text-muted py-4">
                    <i class="fas fa-calendar-check fa-3x mb-3"></i>
                    <p>No hay reservas registradas</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
