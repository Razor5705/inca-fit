<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
  <title>Administrar Asistencias</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
          <i class="fas fa-clipboard-check me-2"></i>Administrar Asistencias
        </h2>
        <a th:href="@{/admin/asistencias/nueva}" class="btn btn-primary">
          <i class="fas fa-plus me-2"></i>Nueva Asistencia
        </a>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Socio</th>
                  <th>Clase</th>
                  <th>Fecha</th>
                  <th>Reserva</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="asistencia : ${asistencias}">
                  <td th:text="${asistencia.id}"></td>
                  <td th:text="${asistencia.socio.nombre}"></td>
                  <td th:text="${asistencia.clase.nombre}"></td>
                  <td th:text="${#temporals.format(asistencia.fecha, 'dd/MM/yyyy')}"></td>
                  <td>
                    <span th:if="${asistencia.reserva != null}" class="badge bg-success">Con Reserva</span>
                    <span th:if="${asistencia.reserva == null}" class="badge bg-warning">Sin Reserva</span>
                  </td>
                  <td>
                    <a th:href="@{/admin/asistencias/ver/{id}(id=${asistencia.id})}" class="btn btn-sm btn-info me-1">
                      <i class="fas fa-eye"></i>
                    </a>
                    <a th:href="@{/admin/asistencias/editar/{id}(id=${asistencia.id})}" class="btn btn-sm btn-warning me-1">
                      <i class="fas fa-edit"></i>
                    </a>
                    <a th:href="@{/admin/asistencias/eliminar/{id}(id=${asistencia.id})}" class="btn btn-sm btn-danger" 
                       onclick="return confirm('¿Estás seguro de eliminar esta asistencia?')">
                      <i class="fas fa-trash"></i>
                    </a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(asistencias)}">
                  <td colspan="6" class="text-center text-muted py-4">
                    <i class="fas fa-clipboard-check fa-3x mb-3"></i>
                    <p>No hay asistencias registradas</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
