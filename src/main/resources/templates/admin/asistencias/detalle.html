<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Detalle de Asistencia</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-user-check me-2"></i>Detalle de Asistencia
            </h4>
            <a th:href="@{/admin/asistencias}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${asistencia.id}">1</dd>

                <dt class="col-sm-3">Socio</dt>
                <dd class="col-sm-9" th:text="${asistencia.socio != null ? asistencia.socio.nombre : 'No asignado'}">Nombre del socio</dd>

                <dt class="col-sm-3">Clase</dt>
                <dd class="col-sm-9" th:text="${asistencia.clase != null ? asistencia.clase.nombre : 'No asignada'}">Nombre de la clase</dd>

                <dt class="col-sm-3">Instructor</dt>
                <dd class="col-sm-9"
                    th:text="${asistencia.clase != null && asistencia.clase.instructor != null ? asistencia.clase.instructor.nombreCompleto : 'No asignado'}">
                    Instructor
                </dd>

                <dt class="col-sm-3">Fecha</dt>
                <dd class="col-sm-9" th:text="${asistencia.fecha != null ? #temporals.format(asistencia.fecha, 'dd/MM/yyyy') : 'No registrada'}">
                    01/01/2025
                </dd>

                <dt class="col-sm-3">Reserva Asociada</dt>
                <dd class="col-sm-9" th:text="${asistencia.reserva != null ? asistencia.reserva.id : 'Sin reserva'}">Reserva</dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
