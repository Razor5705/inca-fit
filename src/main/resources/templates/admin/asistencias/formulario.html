<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Formulario de Asistencia</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <h2 class="mb-4" th:text="${asistencia.id == null ? 'Nueva Asistencia' : 'Editar Asistencia'}">Formulario de Asistencia</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${asistencia.id == null ? '/admin/asistencias/nueva' : '/admin/asistencias/editar/' + asistencia.id}" th:object="${asistencia}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="socio" class="form-label">Socio</label>
                            <select class="form-select" id="socio" th:field="*{socio}" required>
                                <option value="">Seleccionar socio...</option>
                                <option th:each="socio : ${socios}" 
                                        th:value="${socio.id}" 
                                        th:text="${socio.nombre + ' (' + socio.email + ')'}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="clase" class="form-label">Clase</label>
                            <select class="form-select" id="clase" th:field="*{clase}" required>
                                <option value="">Seleccionar clase...</option>
                                <option th:each="clase : ${clases}" 
                                        th:value="${clase.id}" 
                                        th:text="${clase.instructor != null ? clase.nombre + ' - ' + clase.instructor.nombreCompleto : clase.nombre + ' - Sin instructor'}"></option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="reserva" class="form-label">Reserva</label>
                            <select class="form-select" id="reserva" th:field="*{reserva}" required>
                                <option value="">Seleccionar reserva...</option>
                                <option th:each="reserva : ${reservas}" 
                                        th:value="${reserva.id}" 
                                        th:text="${'Reserva #' + reserva.id + ' - ' + reserva.socio.nombre}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/admin/asistencias}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
