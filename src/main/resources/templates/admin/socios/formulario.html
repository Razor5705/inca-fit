<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title th:text="${socio.id == null ? 'Nuevo socio' : 'Editar socio'}">Socio</title>
    <meta charset="utf-8"/>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0" th:text="${socio.id == null ? 'Nuevo Socio' : 'Editar Socio'}">Formulario de Socio</h2>
        <a th:href="@{/admin/socios}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-2"></i>Volver
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${socio.id == null ? '/admin/socios/nueva' : '/admin/socios/editar/' + socio.id}"
                  th:object="${socio}"
                  method="post"
                  class="needs-validation">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="dni" class="form-label">DNI</label>
                        <input type="text" class="form-control" id="dni" th:field="*{dni}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">TelÃ©fono</label>
                        <input type="text" class="form-control" id="telefono" th:field="*{telefono}" placeholder="+34 600 000 000">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3" th:if="${socio.id == null}">
                        <label for="password" class="form-label">ContraseÃ±a</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" required>
                        <small class="text-muted">Se enviarÃ¡ al socio tras el alta.</small>
                    </div>
                    <div class="col-md-6 mb-3" th:if="${socio.id != null}">
                        <label for="nuevaPassword" class="form-label">Nueva contraseÃ±a</label>
                        <input type="password" class="form-control" id="nuevaPassword" name="nuevaPassword" placeholder="Deja vacÃ­o para mantener la actual">
                        <input type="hidden" th:field="*{password}">
                        <small class="text-muted">Solo completa este campo si deseas actualizarla.</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="rol" class="form-label">Rol</label>
                        <select class="form-select" id="rol" th:field="*{rol}" required>
                            <option value="USUARIO">Usuario</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="membresiaId" class="form-label">MembresÃ­a</label>
                        <select class="form-select" id="membresiaId" name="membresiaId" required>
                            <option value="">Seleccionar membresÃ­a...</option>
                            <option th:each="membresia : ${membresias}"
                                    th:value="${membresia.id}"
                                    th:selected="${(socio.membresia != null and socio.membresia.id == membresia.id) or (membresiaSeleccionada != null and membresiaSeleccionada == membresia.id)}"
                                    th:text="${membresia.tipoMembresia + ' - ' + #numbers.formatCurrency(membresia.precio)}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="fechaRegistro" class="form-label">Fecha de registro</label>
                        <input type="date" class="form-control" id="fechaRegistro" th:field="*{fechaRegistro}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fechaInicioMembresia" class="form-label">Inicio de membresÃ­a</label>
                        <input type="date" class="form-control" id="fechaInicioMembresia" th:field="*{fechaInicioMembresia}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="fechaFinMembresia" class="form-label">Fin de membresÃ­a</label>
                        <input type="date" class="form-control" id="fechaFinMembresia" th:field="*{fechaFinMembresia}">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
                            <label class="form-check-label" for="activo">Activo</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/admin/socios}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
