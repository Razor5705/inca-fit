<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
          <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
            <h3 class="fw-light my-4" th:text="${socio.id} ? 'Editar Socio' : 'Nuevo Socio'"></h3>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/admin/socios/guardar}" th:object="${socio}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="row">
                <div class="col-md-6">
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="dni" th:field="*{dni}" placeholder="DNI" required>
                    <label for="dni">DNI</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Nombre" required>
                    <label for="nombre">Nombre</label>
                  </div>
                </div>
              </div>

              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Email" required>
                <label for="email">Email</label>
              </div>

              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Contraseña">
                <label for="password">Contraseña</label>
                <small class="text-muted">Dejar en blanco para mantener la actual.</small>
              </div>

              <div class="row">
                <div class="col-md-6">
                  <div class="form-floating mb-3">
                    <select class="form-select" id="rol" th:field="*{rol}" required>
                      <option th:each="rolOpt : ${T(com.incafit.Model.Rol).values()}"
                              th:value="${rolOpt}"
                              th:text="${rolOpt}"></option>
                    </select>
                    <label for="rol">Rol</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating mb-3">
                    <select class="form-select" id="membresia" th:field="*{membresia}">
                      <option value="">-- Sin membresía --</option>
                      <option th:each="mem : ${membresias}"
                              th:value="${mem.id}"
                              th:text="${mem.tipoMembresia}"></option>
                    </select>
                    <label for="membresia">Membresía</label>
                  </div>
                </div>
              </div>

              <div class="mt-4 d-flex justify-content-end">
                <a th:href="@{/admin/socios}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-primary-custom">Guardar Cambios</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
