<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${socio.id} ? 'Editar Socio' : 'Nuevo Socio'"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"></head>
</head>
<body>
<div class="container mt-5">
  <h1 th:text="${socio.id} ? 'Editar Socio' : 'Nuevo Socio'"></h1>
  <form th:action="@{/admin/socios/guardar}" th:object="${socio}" method="post">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label class="form-label">DNI</label>
      <input type="text" class="form-control" th:field="*{dni}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" class="form-control" th:field="*{nombre}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" th:field="*{email}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" th:field="*{password}">
      <small class="text-muted">Dejar en blanco para mantener la actual</small>
    </div>

    <div class="mb-3">
      <label class="form-label">Rol</label>
      <select class="form-select" th:field="*{rol}" required>
        <option th:each="rol : ${T(com.incafit.model.Rol).values()}"
                th:value="${rol}"
                th:text="${rol}"
                th:selected="${socio.rol == rol}"></option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Membresía</label>
      <select class="form-select" th:field="*{membresia}">
        <option value="">-- Sin membresía --</option>
        <option th:each="membresia : ${membresias}"
                th:value="${membresia.id}"
                th:text="${membresia.nombre}"
                th:selected="${socio.membresia != null and socio.membresia.id == membresia.id}"></option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a th:href="@{/admin/socios}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
</body>
</html>
