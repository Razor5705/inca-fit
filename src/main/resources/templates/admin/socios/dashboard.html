<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Panel de Administración</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"></head>
</head>
<body>
<div class="container mt-5">
  <h1>Panel de Administración - Inca Fit</h1>

  <div class="row mt-4">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Socios</h5>
          <p class="card-text">Gestión de usuarios registrados</p>
          <a href="/admin/socios" class="btn btn-primary">Administrar</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Membresías</h5>
          <p class="card-text">Tipos de planes y precios</p>
          <a href="/admin/membresias" class="btn btn-primary">Administrar</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Clases</h5>
          <p class="card-text">Programación de actividades</p>
          <a href="#" class="btn btn-secondary">Próximamente</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
