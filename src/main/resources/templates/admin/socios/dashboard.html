<!-- src/main/resources/templates/admin/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Panel de Administración - Inca Fit</title>
  <th:block th:replace="fragments/header :: head"></th:block>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container-fluid my-5">
  <div class="row">
    <!-- Sidebar -->
    <div th:replace="fragments/admin-sidebar :: sidebar"></div>

    <!-- Main content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
      <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Dashboard</h1>
      </div>

      <!-- Estadísticas -->
      <div class="row">
        <div class="col-md-3">
          <div class="card text-white bg-primary mb-3">
            <div class="card-body">
              <h5 class="card-title">Socios Activos</h5>
              <p class="card-text" th:text="${estadisticas.totalSocios}">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-success mb-3">
            <div class="card-body">
              <h5 class="card-title">Reservas Hoy</h5>
              <p class="card-text" th:text="${estadisticas.reservasHoy}">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-warning mb-3">
            <div class="card-body">
              <h5 class="card-title">Facturas Pendientes</h5>
              <p class="card-text" th:text="${estadisticas.facturasPendientes}">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-white bg-info mb-3">
            <div class="card-body">
              <h5 class="card-title">Ingresos Mensuales</h5>
              <p class="card-text" th:text="${#numbers.formatCurrency(estadisticas.ingresosMensuales)}">$0.00</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Gráficos y tablas adicionales -->
    </main>
  </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
