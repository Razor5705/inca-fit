<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Gestión de Socios</h1>
      <a th:href="@{/admin/socios/nuevo}" class="btn btn-primary-custom">
        <i class="fas fa-plus me-1"></i> Nuevo Socio
      </a>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover admin-table">
            <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="socio : ${socios}">
              <td th:text="${socio.id}"></td>
              <td th:text="${socio.nombre}"></td>
              <td th:text="${socio.email}"></td>
              <td th:text="${socio.telefono}"></td>
              <td>
                <span th:if="${socio.activo}" class="badge bg-success status-badge">
                  <i class="fas fa-check-circle me-1"></i> Activo
                </span>
                <span th:unless="${socio.activo}" class="badge bg-danger status-badge">
                  <i class="fas fa-times-circle me-1"></i> Inactivo
                </span>
              </td>
              <td>
                <div class="d-flex gap-2">
                  <a th:href="@{/admin/socios/editar/{id}(id=${socio.id})}" class="btn btn-sm btn-outline-primary btn-action" title="Editar socio">
                    <i class="fas fa-edit"></i>
                  </a>
                  <form th:action="@{/admin/socios/{id}/estado(id=${socio.id})}" method="post" class="d-inline">
                    <input type="hidden" name="activo" th:value="${!socio.activo}">
                    <button type="submit" class="btn btn-sm btn-action" th:classappend="${socio.activo} ? 'btn-outline-warning' : 'btn-outline-success'" th:title="${socio.activo} ? 'Desactivar socio' : 'Activar socio'">
                      <i th:if="${socio.activo}" class="fas fa-toggle-off"></i>
                      <i th:unless="${socio.activo}" class="fas fa-toggle-on"></i>
                    </button>
                  </form>
                  <form th:action="@{/admin/socios/{id}/eliminar(id=${socio.id})}" method="post" onsubmit="return confirm('¿Está seguro de eliminar este socio?');" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger btn-action" title="Eliminar socio">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>

        <div th:if="${success}" class="alert alert-success mt-3">
          <i class="fas fa-check-circle me-2"></i>
          <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger mt-3">
          <i class="fas fa-exclamation-circle me-2"></i>
          <span th:text="${error}"></span>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
