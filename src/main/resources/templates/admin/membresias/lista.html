<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
  <title>Administrar Membresías</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
          <i class="fas fa-id-card me-2"></i>Administrar Membresías
        </h2>
        <a th:href="@{/admin/membresias/nueva}" class="btn btn-primary">
          <i class="fas fa-plus me-2"></i>Nueva Membresía
        </a>
      </div>
    </div>
  </div>

  <!-- Mensajes de éxito y error -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="fas fa-check-circle me-2"></i>
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="fas fa-exclamation-circle me-2"></i>
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Tipo</th>
                  <th>Descripción</th>
                  <th>Precio</th>
                  <th>Duración (días)</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="membresia : ${membresias}">
                  <td th:text="${membresia.id}"></td>
                  <td th:text="${membresia.tipoMembresia}"></td>
                  <td th:text="${membresia.descripcion}"></td>
                  <td th:text="${#numbers.formatCurrency(membresia.precio)}"></td>
                  <td th:text="${membresia.duracionDias}"></td>
                  <td>
                    <a th:href="@{/admin/membresias/editar/{id}(id=${membresia.id})}" class="btn btn-sm btn-warning me-1">
                      <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{/admin/membresias/eliminar/{id}(id=${membresia.id})}" method="post" style="display: inline;">
                      <button type="submit" class="btn btn-sm btn-danger" 
                              onclick="return confirm('¿Estás seguro de eliminar esta membresía?')">
                        <i class="fas fa-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(membresias)}">
                  <td colspan="6" class="text-center text-muted py-4">
                    <i class="fas fa-id-card fa-3x mb-3"></i>
                    <p>No hay membresías registradas</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
