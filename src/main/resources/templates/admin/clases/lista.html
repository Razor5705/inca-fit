<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
  <title>Administrar Clases</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
          <i class="fas fa-dumbbell me-2"></i>
          <span th:text="${titulo != null ? titulo : 'Administrar Clases'}">Administrar Clases</span>
        </h2>
        <div>
          <a th:href="@{/admin/clases/activas}" class="btn btn-success me-2">
            <i class="fas fa-check-circle me-2"></i>Activas
          </a>
          <a th:href="@{/admin/clases/inactivas}" class="btn btn-warning me-2">
            <i class="fas fa-pause-circle me-2"></i>Inactivas
          </a>
          <a th:href="@{/admin/clases}" class="btn btn-secondary me-2">
            <i class="fas fa-list me-2"></i>Todas
          </a>
          <a th:href="@{/admin/clases/nueva}" class="btn btn-primary">
            <i class="fas fa-plus me-2"></i>Nueva Clase
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Descripción</th>
                  <th>Instructor</th>
                  <th>Hora</th>
                  <th>Duración (min)</th>
                  <th>Capacidad</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="clase : ${clases}">
                  <td th:text="${clase.id}"></td>
                  <td th:text="${clase.nombre}"></td>
                  <td th:text="${clase.descripcion}"></td>
                  <td th:text="${clase.instructor.nombreCompleto}"></td>
                  <td th:text="${#temporals.format(clase.hora, 'HH:mm')}"></td>
                  <td th:text="${clase.duracionMinutos}"></td>
                  <td th:text="${clase.capacidadMaxima}"></td>
                  <td>
                    <span th:if="${clase.activo}" class="badge bg-success">
                      <i class="fas fa-check-circle me-1"></i>Activa
                    </span>
                    <span th:unless="${clase.activo}" class="badge bg-warning">
                      <i class="fas fa-pause-circle me-1"></i>Inactiva
                    </span>
                  </td>
                  <td>
                    <div class="btn-group" role="group">
                      <a th:href="@{/admin/clases/editar/{id}(id=${clase.id})}" class="btn btn-sm btn-warning me-1">
                        <i class="fas fa-edit"></i>
                      </a>
                      <form th:if="${clase.activo}" th:action="@{/admin/clases/desactivar/{id}(id=${clase.id})}" method="post" class="d-inline me-1">
                        <button type="submit" class="btn btn-sm btn-secondary" 
                                onclick="return confirm('¿Estás seguro de desactivar esta clase?')">
                          <i class="fas fa-pause"></i>
                        </button>
                      </form>
                      <form th:unless="${clase.activo}" th:action="@{/admin/clases/activar/{id}(id=${clase.id})}" method="post" class="d-inline me-1">
                        <button type="submit" class="btn btn-sm btn-success" 
                                onclick="return confirm('¿Estás seguro de activar esta clase?')">
                          <i class="fas fa-play"></i>
                        </button>
                      </form>
                      <a th:href="@{/admin/clases/eliminar/{id}(id=${clase.id})}" class="btn btn-sm btn-danger" 
                         onclick="return confirm('¿Estás seguro de eliminar esta clase?')">
                        <i class="fas fa-trash"></i>
                      </a>
                    </div>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clases)}">
                  <td colspan="9" class="text-center text-muted py-4">
                    <i class="fas fa-dumbbell fa-3x mb-3"></i>
                    <p>No hay clases registradas</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
