<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3">Gestión de Clases</h1>
      <a th:href="@{/admin/clases/nueva}" class="btn btn-primary-custom">
        <i class="fas fa-plus me-1"></i> Nueva Clase
      </a>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover admin-table">
            <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Instructor</th>
              <th>Fecha y Hora</th>
              <th>Duración</th>
              <th>Capacidad</th>
              <th>Inscritos</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="clase : ${clases}">
              <td th:text="${clase.nombre}"></td>
              <td th:text="${clase.instructor}"></td>
              <td th:text="${#temporals.format(clase.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
              <td th:text="${clase.duracionEnMinutos + ' min'}"></td>
              <td th:text="${clase.capacidad}"></td>
              <td th:text="${clase.reservas.size()}"></td>
              <td>
                <div class="d-flex gap-2">
                  <a th:href="@{/admin/clases/editar/{id}(id=${clase.id})}" class="btn btn-sm btn-outline-primary btn-action" title="Editar clase">
                    <i class="fas fa-edit"></i>
                  </a>
                  <form th:action="@{/admin/clases/{id}/eliminar(id=${clase.id})}" method="post" onsubmit="return confirm('¿Está seguro de eliminar esta clase?');" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger btn-action" title="Eliminar clase">
                      <i class="fas fa-trash-alt"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
