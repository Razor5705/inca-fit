<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Administrar Clases</title>
</head>
<body>
<div layout:fragment="content" class="container mt-5">
    <h2>Administrar Clases</h2>
    <a th:href="@{/admin/clases/nueva}" class="btn btn-primary mb-3">Nueva Clase</a>
    <table class="table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Instructor</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="clase : ${clases}">
            <td th:text="${clase.nombre}"></td>
            <td th:text="${clase.descripcion}"></td>
            <td th:text="${clase.instructor.nombre}"></td>
            <td>
                <a th:href="@{/admin/clases/editar/{id}(id=${clase.id})}" class="btn btn-sm btn-info">Editar</a>
                <a th:href="@{/admin/clases/eliminar/{id}(id=${clase.id})}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
