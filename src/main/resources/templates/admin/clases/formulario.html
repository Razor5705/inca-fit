<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Formulario de Clase</title>
</head>
<body>
<div layout:fragment="content" class="container mt-5">
    <h2 th:if="${clase.id == null}">Nueva Clase</h2>
    <h2 th:if="${clase.id != null}">Editar Clase</h2>
    <form th:action="${clase.id == null} ? @{/admin/clases/nueva} : @{/admin/clases/editar/{id}(id=${clase.id})}"
          th:object="${clase}" method="post">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre" th:field="*{nombre}">
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" th:field="*{descripcion}"></textarea>
        </div>
        <div class="mb-3">
            <label for="instructor" class="form-label">Instructor</label>
            <select class="form-control" id="instructor" th:field="*{instructor.id}">
                <option th:each="instructor : ${instructores}"
                        th:value="${instructor.id}"
                        th:text="${instructor.nombre}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </form>
</div>
</body>
</html>
