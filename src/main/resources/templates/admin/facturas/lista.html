<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
  <title>Administrar Facturas</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
          <i class="fas fa-file-invoice me-2"></i>Administrar Facturas
        </h2>
        <a th:href="@{/admin/facturas/nueva}" class="btn btn-primary">
          <i class="fas fa-plus me-2"></i>Nueva Factura
        </a>
      </div>
    </div>
  </div>

  <!-- Mensajes de éxito y error -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="fas fa-check-circle me-2"></i>
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  
  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="fas fa-exclamation-circle me-2"></i>
    <span th:text="${errorMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Socio</th>
                  <th>Fecha</th>
                  <th>Total</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="factura : ${facturas}">
                  <td th:text="${factura.id}"></td>
                  <td th:text="${factura.socio.nombre}"></td>
                  <td th:text="${#temporals.format(factura.fecha, 'dd/MM/yyyy')}"></td>
                  <td th:text="${#numbers.formatCurrency(factura.total)}"></td>
                  <td>
                    <span th:if="${factura.estado == 'PENDIENTE'}" class="badge bg-warning">Pendiente</span>
                    <span th:if="${factura.estado == 'PAGADA'}" class="badge bg-success">Pagada</span>
                    <span th:if="${factura.estado == 'VENCIDA'}" class="badge bg-danger">Vencida</span>
                  </td>
                  <td>
                    <a th:href="@{/admin/facturas/ver/{id}(id=${factura.id})}" class="btn btn-sm btn-info me-1">
                      <i class="fas fa-eye"></i>
                    </a>
                    <a th:href="@{/admin/facturas/editar/{id}(id=${factura.id})}" class="btn btn-sm btn-warning me-1">
                      <i class="fas fa-edit"></i>
                    </a>
                    <form th:action="@{/admin/facturas/eliminar/{id}(id=${factura.id})}" method="post" style="display: inline;">
                      <button type="submit" class="btn btn-sm btn-danger"
                              th:disabled="${factura.estado == 'PAGADA'}"
                              onclick="return confirm('¿Estás seguro de eliminar esta factura? Solo facturas no pagadas.');">
                        <i class="fas fa-trash"></i>
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(facturas)}">
                  <td colspan="6" class="text-center text-muted py-4">
                    <i class="fas fa-file-invoice fa-3x mb-3"></i>
                    <p>No hay facturas registradas</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
