<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Detalle de Factura</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="fas fa-file-invoice me-2"></i>Detalle de Factura
            </h4>
            <a th:href="@{/admin/facturas}" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${factura.id}">1</dd>

                <dt class="col-sm-3">Socio</dt>
                <dd class="col-sm-9" th:text="${factura.socio != null ? factura.socio.nombre : 'No asignado'}">Nombre del socio</dd>

                <dt class="col-sm-3">Fecha</dt>
                <dd class="col-sm-9" th:text="${factura.fecha != null ? #temporals.format(factura.fecha, 'dd/MM/yyyy') : 'No registrada'}">
                    01/01/2025
                </dd>

                <dt class="col-sm-3">Total</dt>
                <dd class="col-sm-9" th:text="${factura.total != null ? '€' + #numbers.formatDecimal(factura.total, 1, 'COMMA', 2, 'POINT') : '0,00'}">
                    €0,00
                </dd>

                <dt class="col-sm-3">Estado</dt>
                <dd class="col-sm-9">
                    <span th:if="${factura.estado == 'PAGADA'}" class="badge bg-success">Pagada</span>
                    <span th:if="${factura.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendiente</span>
                    <span th:if="${factura.estado == 'CANCELADA'}" class="badge bg-danger">Cancelada</span>
                    <span th:if="${factura.estado == null}" class="badge bg-secondary">Sin estado</span>
                </dd>
            </dl>

            <div th:if="${factura.detalles != null and !factura.detalles.isEmpty()}" class="mt-4">
                <h5>Detalles</h5>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <thead class="table-light">
                            <tr>
                                <th>Descripción</th>
                                <th>Cantidad</th>
                                <th>Precio Unitario</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="detalle : ${factura.detalles}">
                                <td th:text="${detalle.descripcion}">Servicio</td>
                                <td th:text="${detalle.cantidad}">1</td>
                                <td th:text="${'€' + #numbers.formatDecimal(detalle.precioUnitario, 1, 'COMMA', 2, 'POINT')}">€0,00</td>
                                <td th:text="${'€' + #numbers.formatDecimal(detalle.subtotal, 1, 'COMMA', 2, 'POINT')}">€0,00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
