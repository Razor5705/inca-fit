<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout.html}">
<head>
    <title>Formulario de Factura</title>
</head>
<body>
<div layout:fragment="adminContent" class="container-fluid py-4">
    <h2 class="mb-4" th:text="${factura.id == null ? 'Nueva Factura' : 'Editar Factura'}">Formulario de Factura</h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/facturas/guardar}" th:object="${factura}" method="post">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="socio" class="form-label">Socio</label>
                            <select class="form-select" id="socio" th:field="*{socio}" required>
                                <option value="">Seleccionar socio...</option>
                                <option th:each="socio : ${socios}" 
                                        th:value="${socio.id}" 
                                        th:text="${socio.nombre + ' (' + socio.email + ')'}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="total" class="form-label">Total</label>
                            <input type="number" step="0.01" class="form-control" id="total" th:field="*{total}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado" th:field="*{estado}" required>
                                <option value="PENDIENTE">Pendiente</option>
                                <option value="PAGADA">Pagada</option>
                                <option value="VENCIDA">Vencida</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/admin/facturas}" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
