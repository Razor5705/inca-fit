<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-lg border-0 rounded-lg mt-5">
          <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
            <h3 class="fw-light my-4" th:text="${pageTitle}"></h3>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/admin/rutinas/guardar}" th:object="${rutina}" method="post">
              <input type="hidden" th:field="*{id}">

              <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Nombre de la rutina" required>
                <label for="nombre">Nombre de la Rutina</label>
                <div class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
              </div>

              <div class="form-floating mb-3">
                <select class="form-select" id="nivel" th:field="*{nivel}">
                  <option value="Principiante">Principiante</option>
                  <option value="Intermedio">Intermedio</option>
                  <option value="Avanzado">Avanzado</option>
                </select>
                <label for="nivel">Nivel</label>
              </div>

              <div class="form-floating mb-3">
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" placeholder="Descripción corta" style="height: 100px"></textarea>
                <label for="descripcion">Descripción Corta</label>
              </div>

              <div class="mb-3">
                <label for="contenido" class="form-label">Contenido de la Rutina (Ejercicios)</label>
                <textarea class="form-control" id="contenido" th:field="*{contenido}" placeholder="Escribe los ejercicios, series, repeticiones, etc." rows="10"></textarea>
                <small class="text-muted">Puedes usar formato simple o Markdown para organizar los ejercicios.</small>
              </div>

              <div class="mt-4 d-flex justify-content-end">
                <a th:href="@{/admin/rutinas}" class="btn btn-secondary me-2">Cancelar</a>
                <button type="submit" class="btn btn-primary-custom">Guardar Rutina</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
