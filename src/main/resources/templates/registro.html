<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Inca Fit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <h2>Registro de Nuevo Socio</h2>

    <div th:if="${param.registroExitoso}" class="alert alert-success">
        ¡Registro exitoso! Por favor inicia sesión.
    </div>

    <form th:action="@{/procesar-registro}" th:object="${socio}" method="post">
        <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" class="form-control" th:field="*{dni}">
            <div th:if="${#fields.hasErrors('dni')}" class="text-danger">
                <span th:errors="*{dni}"></span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Nombre Completo</label>
            <input type="text" class="form-control" th:field="*{nombre}">
            <div th:if="${#fields.hasErrors('nombre')}" class="text-danger">
                <span th:errors="*{nombre}"></span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}">
            <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                <span th:errors="*{email}"></span>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" th:field="*{password}">
            <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                <span th:errors="*{password}"></span>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Registrarse</button>
    </form>
</div>
</body>
</html>
