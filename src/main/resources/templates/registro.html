<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 rounded-lg mt-5">
        <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
          <h3 class="fw-light my-4">Crea tu Cuenta</h3>
        </div>
        <div class="card-body p-4">
          <div th:if="${param.registroExitoso}" class="alert alert-success">
            ¡Registro exitoso! Por favor <a th:href="@{/login}">inicia sesión</a>.
          </div>
          <form th:action="@{/procesar-registro}" th:object="${socio}" method="post">
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="dni" th:field="*{dni}" placeholder="DNI" required>
              <label for="dni">DNI</label>
              <div th:if="${#fields.hasErrors('dni')}" class="text-danger" th:errors="*{dni}"></div>
            </div>
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="nombre" th:field="*{nombre}" placeholder="Nombre Completo" required>
              <label for="nombre">Nombre Completo</label>
              <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="nombre@ejemplo.com" required>
              <label for="email">Email</label>
              <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Contraseña" required>
              <label for="password">Contraseña</label>
              <div th:if="${#fields.hasErrors('password')}" class="text-danger" th:errors="*{password}"></div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary-custom btn-lg">Registrarse</button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center py-3">
          <div class="small"><a th:href="@{/login}">¿Ya tienes una cuenta? Inicia Sesión</a></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
