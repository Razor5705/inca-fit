<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Recuperar contraseña</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
                    <h3 class="fw-light my-4">Recuperar contraseña</h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Ingresa tu email. Si existe en el sistema, enviaremos una contraseña temporal.</p>
                    <div th:if="${mensaje}" class="alert alert-info" th:text="${mensaje}"></div>
                    <form th:action="@{/forgot-password}" method="post">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                            <label for="email">Email</label>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Enviar</button>
                        </div>
                    </form>
                    <div th:if="${tempPassword != null}" class="alert alert-warning mt-3">
                        <strong>Demo:</strong> <span th:text="${tempPassword}"></span>
                    </div>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small">
                        <a th:href="@{/login}">Volver a iniciar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
