<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-lg border-0 rounded-lg mt-5">
        <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
          <h3 class="fw-light my-4">Iniciar Sesión</h3>
        </div>
        <div class="card-body p-4">
          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Email o contraseña inválidos.
          </div>
          <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Has cerrado sesión.
          </div>
          <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="username" name="username" placeholder="nombre@ejemplo.com" required>
              <label for="username">Email</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
              <label for="password">Contraseña</label>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary-custom btn-lg">Entrar</button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center py-3">
          <div class="small"><a th:href="@{/registro}">¿No tienes una cuenta? ¡Regístrate!</a></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
