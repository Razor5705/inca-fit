<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="display-4">Bienvenido, <span th:text="${#authentication.name}"></span>!</h1>
      <p class="lead">Este es tu panel de control personal.</p>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card feature-card h-100">
          <div class="card-body text-center p-4">
            <div class="feature-icon"><i class="fas fa-dumbbell"></i></div>
            <h3 class="card-title">Mis Rutinas</h3>
            <p class="card-text">Consulta tus planes de entrenamiento.</p>
            <a th:href="@{/socio/rutinas}" class="btn btn-primary-custom mt-auto">Ver Rutinas</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card feature-card h-100">
          <div class="card-body text-center p-4">
            <div class="feature-icon"><i class="fas fa-calendar-check"></i></div>
            <h3 class="card-title">Mis Reservas</h3>
            <p class="card-text">Consulta y gestiona tus clases.</p>
            <a th:href="@{/socio/reservas}" class="btn btn-primary-custom mt-auto">Ver Mis Reservas</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card feature-card h-100">
          <div class="card-body text-center p-4">
            <div class="feature-icon"><i class="fas fa-file-invoice-dollar"></i></div>
            <h3 class="card-title">Mis Facturas</h3>
            <p class="card-text">Consulta tu historial de pagos.</p>
            <a th:href="@{/socio/facturas}" class="btn btn-primary-custom mt-auto">Ver Mis Facturas</a>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center mt-5">
      <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
      </form>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
