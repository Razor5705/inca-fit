<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="display-4">Bienvenido, <span th:text="${username}"></span>!</h1>
      <p class="lead">Este es tu panel de control personal.</p>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card feature-card h-100">
          <div class="card-body text-center p-4">
            <div class="feature-icon">
              <i class="fas fa-calendar-check"></i>
            </div>
            <h3 class="card-title">Mis Reservas</h3>
            <p class="card-text">Consulta y gestiona tus clases reservadas.</p>
            <a href="/socio/reservas" class="btn btn-primary-custom mt-auto">Ver mis reservas</a>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card feature-card h-100">
          <div class="card-body text-center p-4">
            <div class="feature-icon">
              <i class="fas fa-file-invoice-dollar"></i>
            </div>
            <h3 class="card-title">Mis Facturas</h3>
            <p class="card-text">Consulta tu historial de pagos y facturas.</p>
            <a href="/socio/facturas" class="btn btn-primary-custom mt-auto">Ver mis facturas</a>
          </div>
        </div>
      </div>
    </div>
    <div class="text-center mt-5">
        <a href="/logout" class="btn btn-danger">Cerrar sesión</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
