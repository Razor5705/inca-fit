<!-- dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Inca Fit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous"></head>
<body>
<div class="container mt-5">
  <h1>Bienvenido, <span th:text="${username}"></span>!</h1>
  <div class="card mt-4">
    <div class="card-body">
      <h5 class="card-title">Tu Panel de Control</h5>
      <p class="card-text">Aquí encontrarás tus clases reservadas, pagos y más.</p>
      <a href="#" class="btn btn-primary">Ver mis reservas</a>
      <a href="/logout" class="btn btn-secondary">Cerrar sesión</a>
    </div>
  </div>
</div>
</body>
</html>
