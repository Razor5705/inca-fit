<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
        <i class="fas fa-dumbbell me-2 text-warning"></i>
        <span class="fw-bold">INCA FIT</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <th:block sec:authorize="isAnonymous()">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/about}">
                <i class="fas fa-info-circle me-1"></i> Acerca de
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/contacto}">
                <i class="fas fa-envelope me-1"></i> Contacto
              </a>
            </li>
          </th:block>
          <th:block sec:authorize="isAuthenticated()">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/dashboard}">
                <i class="fas fa-tachometer-alt me-1"></i> Panel
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/socio/clases}">
                <i class="fas fa-dumbbell me-1"></i> Ver Clases
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/socio/reservas}">
                <i class="fas fa-calendar-check me-1"></i> Reservas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/socio/membresia}">
                <i class="fas fa-id-card me-1"></i> Membresia
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" th:href="@{/socio/facturas}">
                <i class="fas fa-file-invoice me-1"></i> Facturas
              </a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link text-warning" th:href="@{/admin}">
                <i class="fas fa-cog me-1"></i> Admin
              </a>
            </li>
          </th:block>
        </ul>

        <ul class="navbar-nav ms-auto">
          <!-- Para usuarios no autenticados -->
          <th:block sec:authorize="isAnonymous()">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/login}">
                <i class="fas fa-sign-in-alt me-1"></i> Iniciar sesión
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-warning ms-2" th:href="@{/registro}">
                <i class="fas fa-user-plus me-1"></i> Registrarse
              </a>
            </li>
          </th:block>

          <!-- Para usuarios autenticados -->
          <th:block sec:authorize="isAuthenticated()">
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-user-circle me-1"></i>
                <span sec:authentication="principal.username"></span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" th:href="@{/dashboard}"><i class="fas fa-tachometer-alt me-2"></i>Mi Panel</a></li>
                <li><a class="dropdown-item" th:href="@{/dashboard/perfil}"><i class="fas fa-user-edit me-2"></i>Editar Perfil</a></li>
                <li><a class="dropdown-item" th:href="@{/contacto}"><i class="fas fa-envelope me-2"></i>Contacto</a></li>
                <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item text-danger" th:href="@{/admin}"><i class="fas fa-cog me-2"></i>Panel Admin</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="dropdown-item text-danger">
                      <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                    </button>
                  </form>
                </li>
              </ul>
            </li>
          </th:block>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Espacio para compensar el navbar fixed -->
  <div style="height: 76px;"></div>
</header>
</body>
</html>
