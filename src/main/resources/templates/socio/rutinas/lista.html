<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container-fluid py-5" style="background-color: #f8f9fa;">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="display-4">Rutinas Disponibles</h1>
      <p class="lead">Encuentra el plan de entrenamiento perfecto para ti.</p>
    </div>

    <div class="row g-4">
      <div th:each="rutina : ${rutinas}" class="col-md-6 col-lg-4">
        <div class="card feature-card h-100">
          <div class="card-body d-flex flex-column">
            <h3 class="card-title" th:text="${rutina.nombre}"></h3>
            <span class="badge bg-primary align-self-start mb-2" th:text="${rutina.nivel}"></span>
            <p class="card-text flex-grow-1" th:text="${#strings.abbreviate(rutina.descripcion, 150)}"></p>
            <a th:href="@{/socio/rutinas/{id}(id=${rutina.id})}" class="btn btn-primary-custom mt-auto">Ver Rutina</a>
          </div>
        </div>
      </div>
      <div th:if="${rutinas.isEmpty()}" class="col-12">
        <div class="alert alert-info text-center">
          No hay rutinas disponibles en este momento. Vuelve a consultar más tarde.
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
