<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Nueva Reserva</title>
</head>
<body>
<div layout:fragment="content"
     th:with="locale=${T(java.util.Locale).forLanguageTag('es-ES')}"
     class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
                    <h3 class="fw-light my-4">Crear Nueva Reserva</h3>
                </div>
                <div class="card-body p-4">
                    <div th:if="${param.claseId != null}" class="alert alert-primary d-flex align-items-center">
                        <div>
                            <strong>Reserva rapida:</strong>
                            <div class="text-muted small mb-1">Clase seleccionada desde el calendario.</div>
                            <div class="text-muted fw-semibold">
                                <span th:if="${param.dia != null}"
                                      th:text="${T(java.time.DayOfWeek).valueOf(param.dia[0]).getDisplayName(T(java.time.format.TextStyle).FULL, locale)}">Día</span>
                                <span th:if="${param.hora != null}"
                                      th:text="| · ${param.hora[0]}|">· 07:00</span>
                            </div>
                        </div>
                    </div>

                                        <form th:action="@{/socio/reservas/guardar}" th:object="${reserva}" method="post">
                        <input type="hidden" id="fechaHora" th:field="*{fechaHora}">
                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="fechaReserva" name="fechaReserva" required>
                            <label for="fechaReserva">Fecha de la clase</label>
                            <div class="form-text">Cambia el día si deseas otra fecha disponible.</div>
                        </div>

                        <select class="d-none" id="claseId" name="claseId" required>
                            <option value="">Selecciona una clase</option>
                                <option th:each="clase : ${clases}"
                                        th:value="${clase.id}"
                                        th:data-hora="${horasClases[clase.id]}"
                                        th:data-info="${horariosClases[clase.id]}"
                                        th:data-dias="${diasPorClase[clase.id]}"
                                        th:data-inicio="${fechaInicioClases[clase.id]}"
                                        th:data-fin="${fechaFinClases[clase.id]}"
                                        th:data-label="${clase.instructor != null ? clase.nombre + ' - ' + clase.instructor.nombreCompleto : clase.nombre + ' - Sin instructor'}"
                                        th:selected="${param.claseId != null and param.claseId[0] == ('' + clase.id)}"
                                        th:text="${clase.instructor != null ? clase.nombre + ' - ' + clase.instructor.nombreCompleto : clase.nombre + ' - Sin instructor'}">
                                    Nombre de la Clase
                                </option>
                            </select>

                        <div class="alert alert-light border mb-3">
                            <div class="fw-semibold text-secondary">Clase seleccionada</div>
                            <div id="claseResumen" class="text-muted">---</div>
                            <div id="fechaResumen" class="text-muted small mt-1">Fecha sugerida: --/--/----</div>
                        </div>

                        <div id="infoHorario" class="alert alert-info py-2 px-3 small mb-3 d-none">
                            <strong>Horario:</strong>
                            <span id="infoHorarioTexto"></span>
                        </div>
                        <div id="ayudaFecha" class="d-none"></div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Confirmar Reserva</button>
                            <a class="btn btn-outline-secondary" th:href="@{/socio/reservas/calendario}">Volver al horario</a>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small">
                        <a th:href="@{/dashboard}">Volver al Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const claseSelect = document.getElementById('claseId');
        const fechaInput = document.getElementById('fechaReserva');
        const fechaHoraHidden = document.getElementById('fechaHora');
        const infoBox = document.getElementById('infoHorario');
        const infoText = document.getElementById('infoHorarioTexto');
        const ayudaFecha = document.getElementById('ayudaFecha');
        const claseResumen = document.getElementById('claseResumen');
        const fechaResumen = document.getElementById('fechaResumen');

        const horasPorClase = {};
        const infoPorClase = {};
        const diasPorClase = {};
        const inicioPorClase = {};
        const finPorClase = {};
        const hoyISO = new Date().toISOString().split('T')[0];
        fechaInput.setAttribute('min', hoyISO);

        claseSelect.querySelectorAll('option[data-hora]').forEach(option => {
            if (option.value) {
                horasPorClase[option.value] = option.dataset.hora;
                infoPorClase[option.value] = option.dataset.info || '';
                diasPorClase[option.value] = option.dataset.dias || '';
                inicioPorClase[option.value] = option.dataset.inicio || '';
                finPorClase[option.value] = option.dataset.fin || '';
            }
        });

        const mapaDias = {
            'MONDAY': 1,
            'TUESDAY': 2,
            'WEDNESDAY': 3,
            'THURSDAY': 4,
            'FRIDAY': 5,
            'SATURDAY': 6,
            'SUNDAY': 0
        };

        function diaPermitido(fechaISO, claseId) {
            if (!fechaISO || !claseId || !diasPorClase[claseId]) {
                return true;
            }
            const fecha = new Date(fechaISO + 'T00:00:00');
            const diaSemana = fecha.getDay();
            return diasPorClase[claseId]
                .split(',')
                .map(d => mapaDias[d])
                .includes(diaSemana);
        }

        function actualizarRestriccionesFecha(claseId) {
            const inicio = claseId && inicioPorClase[claseId] ? inicioPorClase[claseId] : '';
            const fin = claseId && finPorClase[claseId] ? finPorClase[claseId] : '';

            const minCalculada = inicio ? (inicio > hoyISO ? inicio : hoyISO) : hoyISO;
            fechaInput.setAttribute('min', minCalculada);

            if (fin) {
                fechaInput.setAttribute('max', fin);
            } else {
                fechaInput.removeAttribute('max');
            }

            if (fechaInput.value) {
                if (fechaInput.value < minCalculada || (fin && fechaInput.value > fin)) {
                    fechaInput.value = '';
                    fechaHoraHidden.value = '';
                }
            }
        }

        function obtenerProximaFechaDisponible(claseId, diaObjetivo) {
            if (!claseId) {
                return '';
            }
            const inicio = claseId && inicioPorClase[claseId] ? inicioPorClase[claseId] : hoyISO;
            const fin = claseId && finPorClase[claseId] ? finPorClase[claseId] : '';
            const base = new Date((inicio > hoyISO ? inicio : hoyISO) + 'T00:00:00');
            const objetivoNum = diaObjetivo && mapaDias[diaObjetivo] !== undefined ? mapaDias[diaObjetivo] : null;

            for (let offset = 0; offset < 90; offset++) {
                const fecha = new Date(base);
                fecha.setDate(base.getDate() + offset);
                const iso = fecha.toISOString().split('T')[0];
                if (fin && iso > fin) {
                    break;
                }
                if (!diaPermitido(iso, claseId)) {
                    continue;
                }
                if (objetivoNum !== null && fecha.getDay() !== objetivoNum) {
                    continue;
                }
                return iso;
            }
            return '';
        }

        const preReservaStorage = (() => {
            try {
                return JSON.parse(sessionStorage.getItem('preReservaSeleccion') || '{}');
            } catch (e) {
                return {};
            }
        })();

        const params = new URLSearchParams(window.location.search);
        const claseParam = params.get('claseId') || preReservaStorage.claseId || '';
        const diaPreferido = params.get('dia') || preReservaStorage.dia || '';
        let horaPrefijada = params.get('hora') || preReservaStorage.hora || '';

        function aplicarSeleccionRapida() {
            if (claseParam) {
                const opcionEncontrada = Array.from(claseSelect.options)
                    .find(opt => opt.value && opt.value.toString() === claseParam.toString());
                if (opcionEncontrada) {
                    claseSelect.value = opcionEncontrada.value;
                }
                if (!horaPrefijada && horasPorClase[claseSelect.value]) {
                    horaPrefijada = horasPorClase[claseSelect.value];
                }
                const sugerida = obtenerProximaFechaDisponible(claseSelect.value, diaPreferido);
                if (sugerida) {
                    fechaInput.value = sugerida;
                }
            }
            actualizarCampos();
            if (fechaInput.value && horaPrefijada) {
                fechaHoraHidden.value = fechaInput.value + 'T' + horaPrefijada;
            }
        }
        aplicarSeleccionRapida();
        if (preReservaStorage.claseId) {
            sessionStorage.removeItem('preReservaSeleccion');
        }

        function actualizarCampos() {
            const claseId = claseSelect.value;
            const fecha = fechaInput.value;
            const hora = horaPrefijada || (claseId && horasPorClase[claseId] ? horasPorClase[claseId] : '');
            const info = claseId && infoPorClase[claseId] ? infoPorClase[claseId] : '';
            const labelSeleccion = claseId ? (claseSelect.selectedOptions[0]?.dataset.label || claseSelect.selectedOptions[0]?.text || '') : '';

            if (claseParam && claseId !== claseParam) {
                horaPrefijada = '';
            }

            actualizarRestriccionesFecha(claseId);

            if (info) {
                infoText.textContent = info;
                infoBox.classList.remove('d-none');
            } else {
                infoText.textContent = '';
                infoBox.classList.add('d-none');
            }

            if (claseResumen) {
                claseResumen.textContent = labelSeleccion || 'Selecciona una clase desde el horario.';
            }
            if (fechaResumen) {
                fechaResumen.textContent = fecha ? ('Fecha sugerida: ' + fecha) : 'Fecha sugerida: --/--/----';
            }

            if (fecha && hora) {
                fechaHoraHidden.value = fecha + 'T' + hora;
            } else {
                fechaHoraHidden.value = '';
            }

            if (fecha && claseId) {
                const minPermitida = fechaInput.getAttribute('min') || hoyISO;
                const maxPermitida = finPorClase[claseId] || '';

                if (fecha < minPermitida) {
                    ayudaFecha.textContent = 'No puedes reservar antes del ' + minPermitida + '.';
                    fechaInput.setCustomValidity('La fecha seleccionada es anterior a la permitida.');
                } else if (maxPermitida && fecha > maxPermitida) {
                    ayudaFecha.textContent = 'La clase solo esta disponible hasta el ' + maxPermitida + '.';
                    fechaInput.setCustomValidity('La fecha supera la vigencia de la clase.');
                } else if (!diaPermitido(fecha, claseId)) {
                    ayudaFecha.textContent = 'La clase seleccionada no se dicta ese dia. Elige uno de los dias disponibles.';
                    fechaInput.setCustomValidity('La clase no se dicta este dia.');
                } else {
                    ayudaFecha.textContent = 'La fecha es valida para este horario.';
                    fechaInput.setCustomValidity('');
                }
            } else {
                ayudaFecha.textContent = 'Selecciona una fecha disponible segun el calendario de la clase.';
                fechaInput.setCustomValidity('');
            }
        }

        claseSelect.addEventListener('change', actualizarCampos);
        fechaInput.addEventListener('change', actualizarCampos);
        const formulario = claseSelect.closest('form');
        if (formulario) {
            formulario.addEventListener('submit', function (event) {
                actualizarCampos();
                if (!fechaHoraHidden.value) {
                    event.preventDefault();
                    alert('Selecciona una clase y una fecha para generar la reserva.');
                }
            });
        }

        if (fechaHoraHidden.value) {
            const partes = fechaHoraHidden.value.split('T');
            if (partes.length === 2) {
                fechaInput.value = partes[0];
            }
        } else if (claseParam) {
            const sugerida = obtenerProximaFechaDisponible(claseParam, diaPreferido);
            if (sugerida) {
                fechaInput.value = sugerida;
            }
        }

        actualizarCampos();
        // Forzar repaint de selección inicial si viene por query param
        if (claseParam) {
            claseSelect.dispatchEvent(new Event('change'));
        }

    });
</script>
</body>
</html>
