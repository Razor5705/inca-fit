<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Nueva Reserva</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
                    <h3 class="fw-light my-4">Crear Nueva Reserva</h3>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/socio/reservas/guardar}" th:object="${reserva}" method="post">
                        <input type="hidden" id="fechaHora" th:field="*{fechaHora}">

                        <div class="form-floating mb-2">
                            <select class="form-select" id="claseId" name="claseId" required>
                                <option value="">Selecciona una clase</option>
                                <option th:each="clase : ${clases}"
                                        th:value="${clase.id}"
                                        th:data-hora="${horasClases[clase.id]}"
                                        th:data-info="${horariosClases[clase.id]}"
                                        th:data-dias="${diasPorClase[clase.id]}"
                                        th:data-inicio="${fechaInicioClases[clase.id]}"
                                        th:data-fin="${fechaFinClases[clase.id]}"
                                        th:text="${clase.instructor != null ? clase.nombre + ' - ' + clase.instructor.nombreCompleto : clase.nombre + ' - Sin instructor'}">
                                    Nombre de la Clase
                                </option>
                            </select>
                            <label for="claseId">Clase</label>
                        </div>
                        <div id="infoHorario" class="alert alert-info py-2 px-3 small mb-3 d-none">
                            <strong>Horario:</strong>
                            <span id="infoHorarioTexto"></span>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="fechaReserva" name="fechaReserva" required>
                            <label for="fechaReserva">Fecha</label>
                            <div class="form-text" id="ayudaFecha">
                                Selecciona una fecha disponible segun el calendario de la clase.
                            </div>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="horaClase" placeholder="Hora de la clase" readonly>
                            <label for="horaClase">Hora de la clase</label>
                            <div class="form-text text-muted">
                                La hora se asigna automaticamente según el horario de la clase seleccionada.
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary-custom btn-lg">Confirmar Reserva</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="small">
                        <a th:href="@{/dashboard}">Volver al Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const claseSelect = document.getElementById('claseId');
        const fechaInput = document.getElementById('fechaReserva');
        const horaDisplay = document.getElementById('horaClase');
        const fechaHoraHidden = document.getElementById('fechaHora');
        const infoBox = document.getElementById('infoHorario');
        const infoText = document.getElementById('infoHorarioTexto');
        const ayudaFecha = document.getElementById('ayudaFecha');

        const horasPorClase = {};
        const infoPorClase = {};
        const diasPorClase = {};
        const inicioPorClase = {};
        const finPorClase = {};
        const hoyISO = new Date().toISOString().split('T')[0];
        fechaInput.setAttribute('min', hoyISO);

        claseSelect.querySelectorAll('option[data-hora]').forEach(option => {
            if (option.value) {
                horasPorClase[option.value] = option.dataset.hora;
                infoPorClase[option.value] = option.dataset.info || '';
                diasPorClase[option.value] = option.dataset.dias || '';
                inicioPorClase[option.value] = option.dataset.inicio || '';
                finPorClase[option.value] = option.dataset.fin || '';
            }
        });

        const mapaDias = {
            'MONDAY': 1,
            'TUESDAY': 2,
            'WEDNESDAY': 3,
            'THURSDAY': 4,
            'FRIDAY': 5,
            'SATURDAY': 6,
            'SUNDAY': 0
        };

        function obtenerNombreDias(lista) {
            if (!lista || lista.length === 0) {
                return 'Cualquier dia';
            }
            return lista.join(', ');
        }

        function diaPermitido(fechaISO, claseId) {
            if (!fechaISO || !claseId || !diasPorClase[claseId]) {
                return true;
            }
            const fecha = new Date(fechaISO + 'T00:00:00');
            const diaSemana = fecha.getDay();
            return diasPorClase[claseId]
                .split(',')
                .map(d => mapaDias[d])
                .includes(diaSemana);
        }

        function actualizarRestriccionesFecha(claseId) {
            const inicio = claseId && inicioPorClase[claseId] ? inicioPorClase[claseId] : '';
            const fin = claseId && finPorClase[claseId] ? finPorClase[claseId] : '';

            const minCalculada = inicio ? (inicio > hoyISO ? inicio : hoyISO) : hoyISO;
            fechaInput.setAttribute('min', minCalculada);

            if (fin) {
                fechaInput.setAttribute('max', fin);
            } else {
                fechaInput.removeAttribute('max');
            }

            if (fechaInput.value) {
                if (fechaInput.value < minCalculada || (fin && fechaInput.value > fin)) {
                    fechaInput.value = '';
                    fechaHoraHidden.value = '';
                    horaDisplay.value = '';
                }
            }
        }

        function actualizarCampos() {
            const claseId = claseSelect.value;
            const fecha = fechaInput.value;
            const hora = claseId && horasPorClase[claseId] ? horasPorClase[claseId] : '';
            const info = claseId && infoPorClase[claseId] ? infoPorClase[claseId] : '';

            actualizarRestriccionesFecha(claseId);

            horaDisplay.value = hora ? hora : '';
            if (info) {
                infoText.textContent = info;
                infoBox.classList.remove('d-none');
            } else {
                infoText.textContent = '';
                infoBox.classList.add('d-none');
            }

            if (fecha && hora) {
                fechaHoraHidden.value = `${fecha}T${hora}`;
            } else {
                fechaHoraHidden.value = '';
            }

            if (fecha && claseId) {
                const minPermitida = fechaInput.getAttribute('min') || hoyISO;
                const maxPermitida = finPorClase[claseId] || '';

                if (fecha < minPermitida) {
                    ayudaFecha.textContent = 'No puedes reservar antes del ' + minPermitida + '.';
                    fechaInput.setCustomValidity('La fecha seleccionada es anterior a la permitida.');
                } else if (maxPermitida && fecha > maxPermitida) {
                    ayudaFecha.textContent = 'La clase solo esta disponible hasta el ' + maxPermitida + '.';
                    fechaInput.setCustomValidity('La fecha supera la vigencia de la clase.');
                } else if (!diaPermitido(fecha, claseId)) {
                    ayudaFecha.textContent = 'La clase seleccionada no se dicta ese dia. Elige uno de los dias disponibles.';
                    fechaInput.setCustomValidity('La clase no se dicta este dia.');
                } else {
                    ayudaFecha.textContent = 'La fecha es valida para este horario.';
                    fechaInput.setCustomValidity('');
                }
            } else {
                ayudaFecha.textContent = 'Selecciona una fecha disponible segun el calendario de la clase.';
                fechaInput.setCustomValidity('');
            }
        }

        claseSelect.addEventListener('change', actualizarCampos);
        fechaInput.addEventListener('change', actualizarCampos);
        const formulario = claseSelect.closest('form');
        if (formulario) {
            formulario.addEventListener('submit', function (event) {
                actualizarCampos();
                if (!fechaHoraHidden.value) {
                    event.preventDefault();
                    alert('Selecciona una clase y una fecha para generar la reserva.');
                }
            });
        }

        // Inicializar valores si ya existen (e.g. tras validación fallida)
        if (fechaHoraHidden.value) {
            const partes = fechaHoraHidden.value.split('T');
            if (partes.length === 2) {
                fechaInput.value = partes[0];
                horaDisplay.value = partes[1].substring(0, 5);
            }
        }

        actualizarCampos();
    });
</script>
</body>
</html>
