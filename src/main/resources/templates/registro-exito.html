<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Registro completado</title>
</head>
<body>
<div layout:fragment="content" class="container-fluid py-5" style="background-color: #f8f9fa; min-height: 80vh;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-lg mt-5">
                <div class="card-header text-center" style="background-color: var(--fitness-primary); color: white;">
                    <h3 class="fw-light my-4">¡Registro completado!</h3>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="alert alert-success">
                        <i class="fas fa-check-circle me-2"></i>
                        <span>Tu cuenta se creó correctamente.</span>
                    </div>
                    <p>
                        Hemos enviado un correo de bienvenida y tu factura inicial
                        <span th:if="${registroEmail != null}">
                            a <strong th:text="${registroEmail}">usuario@incafit.com</strong>.
                        </span>
                    </p>
                    <p>Ya puedes iniciar sesión con tu email y la contraseña que configuraste.</p>
                    <div class="d-grid gap-2 mt-4">
                        <a th:href="@{/login}" class="btn btn-primary-custom btn-lg">
                            Ir al inicio de sesión
                        </a>
                        <a th:href="@{/}" class="btn btn-outline-secondary">
                            Volver al inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
