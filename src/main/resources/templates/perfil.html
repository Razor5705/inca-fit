<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout.html}">
<head>
    <title>Editar perfil</title>
</head>
<body>
<div layout:fragment="content" class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4">
        <div>
            <h2 class="mb-1">Mi perfil</h2>
            <p class="text-muted mb-0">Actualiza tus datos de contacto y mantiene segura tu contrasena.</p>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i>Volver al dashboard
        </a>
    </div>

    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Datos personales</h5>
                    <div th:if="${profileSuccess}" class="alert alert-success" th:text="${profileSuccess}"></div>
                    <div th:if="${profileError}" class="alert alert-danger" th:text="${profileError}"></div>
                    <form th:action="@{/dashboard/perfil/editar}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   name="nombre"
                                   th:value="${socio.nombre}"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Telefono de contacto</label>
                            <input type="text"
                                   class="form-control"
                                   id="telefono"
                                   name="telefono"
                                   pattern="[0-9]{9}"
                                   inputmode="numeric"
                                   maxlength="9"
                                   th:value="${socio.telefono}"
                                   title="Introduce exactamente 9 dígitos (por ejemplo 612345678)"
                                   required>
                            <div class="form-text">Ingresa 9 digitos sin espacios ni guiones (ej. 612345678).</div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Guardar cambios
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title mb-3">Cambiar contrasena</h5>
                    <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}"></div>
                    <div th:if="${passwordError}" class="alert alert-danger" th:text="${passwordError}"></div>
                    <form th:action="@{/dashboard/perfil/cambiar-password}" method="post">
                        <div class="mb-3">
                            <label for="passwordActual" class="form-label">Contrasena actual</label>
                            <input type="password"
                                   class="form-control"
                                   id="passwordActual"
                                   name="passwordActual"
                                   autocomplete="current-password"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="nuevaPassword" class="form-label">Nueva contrasena</label>
                            <input type="password"
                                   class="form-control"
                                   id="nuevaPassword"
                                   name="nuevaPassword"
                                   minlength="8"
                                   autocomplete="new-password"
                                   required>
                            <div class="form-text">Debe tener al menos 8 caracteres.</div>
                        </div>
                        <div class="mb-4">
                            <label for="confirmarPassword" class="form-label">Confirmar nueva contrasena</label>
                            <input type="password"
                                   class="form-control"
                                   id="confirmarPassword"
                                   name="confirmarPassword"
                                   minlength="8"
                                   autocomplete="new-password"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="fas fa-lock me-2"></i>Actualizar contrasena
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
